# Used INSTEAD of docker-compose.yml when Hestia/CloudPanel/Nginx owns 80/443.
# Bind only to loopback; the existing HTTPS reverse proxy forwards to localhost:8000.
services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      QP_API_KEY: ${QP_API_KEY:?Set QP_API_KEY in .env}
      QP_DB: /data/quantpilot.db
      QP_STALE_SECONDS: ${QP_STALE_SECONDS:-180}
      QP_EXPECTED_SOURCE: ${QP_EXPECTED_SOURCE:-quantpilot-main}
      QP_EXPECTED_SYMBOLS: ${QP_EXPECTED_SYMBOLS:?Set the exact broker symbol names}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - quantpilot_data:/data
      - ./backups:/backup
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  quantpilot_data:
    name: ${QP_DATA_VOLUME:-quantpilot_data_v4}
